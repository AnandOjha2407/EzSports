# Render Configuration for EZSports
# Deploy both frontend and backend together from this repo

services:
  # Backend API Service
  - type: web
    name: ezports-backend
    rootDir: backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false  # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false  # Set this manually in Render dashboard
      - key: FRONTEND_URL
        sync: false  # Set this manually after frontend deploys

  # Frontend Service (Static Site)
  - type: static
    name: ezports-frontend
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false  # Set this manually to backend URL: https://ezports-backend.onrender.com/api

