# Render Configuration for EZSports
# Deploy both frontend and backend together from this repo

services:
  # Backend API Service
  - type: web
    name: ezports-backend
    rootDir: backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  # Frontend Service (Static Site)
  - type: static
    name: ezports-frontend
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
